name: Android Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build signed APKs (phone + TV)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # GitHub ubuntu-latest 镜像已预装 Android SDK（ANDROID_HOME 已导出，
      # license 已接受，AGP 可自动补装缺失的 build-tools），无需额外 setup。

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties', 'buildSrc/src/main/kotlin/**') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret is missing; release APKs will be unsigned."
            exit 0
          fi
          set -euo pipefail
          KEYSTORE="${GITHUB_WORKSPACE}/release.jks"
          printf '%s' "${KEYSTORE_BASE64}" | base64 -d > "${KEYSTORE}"
          echo "RELEASE_KEYSTORE_PATH=${KEYSTORE}" >> $GITHUB_ENV

      - name: Unit tests (JVM)
        run: ./gradlew :app:testDebugUnitTest :app-tv:testDebugUnitTest --no-daemon --stacktrace

      - name: Build phone APK
        env:
          RELEASE_STORE_FILE: ${{ env.RELEASE_KEYSTORE_PATH }}
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Build TV APK
        env:
          RELEASE_STORE_FILE: ${{ env.RELEASE_KEYSTORE_PATH }}
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app-tv:assembleRelease --no-daemon --stacktrace

      - name: Rename APKs deterministically
        id: apks
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/dist"
          PHONE_APK=$(find app/build/outputs/apk/release -name '*.apk' -type f | head -1)
          TV_APK=$(find app-tv/build/outputs/apk/release -name '*.apk' -type f | head -1)
          [ -n "${PHONE_APK}" ] || { echo "::error::phone APK not found"; exit 1; }
          [ -n "${TV_APK}" ] || { echo "::error::TV APK not found"; exit 1; }
          PHONE_OUT="dist/mofang-video-phone-${GITHUB_REF_NAME}-${GITHUB_SHA::7}.apk"
          TV_OUT="dist/mofang-video-tv-${GITHUB_REF_NAME}-${GITHUB_SHA::7}.apk"
          cp "${PHONE_APK}" "${PHONE_OUT}"
          cp "${TV_APK}" "${TV_OUT}"
          echo "phone=${PHONE_OUT}" >> $GITHUB_OUTPUT
          echo "tv=${TV_OUT}" >> $GITHUB_OUTPUT
          ls -la "${GITHUB_WORKSPACE}/dist/"

      - name: Verify APK signing
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' -type f | head -1)
          if [ -z "${RELEASE_KEYSTORE_PATH}" ]; then
            echo "::notice::keystore not configured, skipping signature verification"
            exit 0
          fi
          "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner" verify --print-certs "${APK}" \
            || { echo "::error::APK signature verification failed"; exit 1; }
        env:
          RELEASE_KEYSTORE_PATH: ${{ env.RELEASE_KEYSTORE_PATH }}
          ANDROID_BUILD_TOOLS: "34.0.0"

      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: mofang-video-phone-apk
          path: ${{ steps.apks.outputs.phone }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload TV APK
        uses: actions/upload-artifact@v4
        with:
          name: mofang-video-tv-apk
          path: ${{ steps.apks.outputs.tv }}
          if-no-files-found: error
          retention-days: 30

      - name: Job summary
        run: |
          {
            echo "### Built APKs"
            echo '```'
            ls -la "${GITHUB_WORKSPACE}/dist/" | tail -n +2
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

  package-source:
    name: Package source archives
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build source zip and tar.gz
        id: archives
        run: |
          set -euo pipefail
          mkdir -p dist-source
          NAME="mofang-video-source-${GITHUB_REF_NAME}-${GITHUB_SHA::7}"
          git archive --format=zip --prefix="${NAME}/" -o "dist-source/${NAME}.zip" HEAD
          git archive --format=tar.gz --prefix="${NAME}/" -o "dist-source/${NAME}.tar.gz" HEAD
          cd dist-source
          sha256sum *.zip *.tar.gz > SHA256SUMS.txt
          echo "name=${NAME}" >> $GITHUB_OUTPUT
          ls -la

      - name: Upload source zip
        uses: actions/upload-artifact@v4
        with:
          name: mofang-video-source-zip
          path: dist-source/*.zip
          if-no-files-found: error
          retention-days: 90

      - name: Upload source tar.gz
        uses: actions/upload-artifact@v4
        with:
          name: mofang-video-source-targz
          path: dist-source/*.tar.gz
          if-no-files-found: error
          retention-days: 90

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: mofang-video-source-checksums
          path: dist-source/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build, package-source]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    timeout-minutes: 20

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: ls -la release-assets/

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
